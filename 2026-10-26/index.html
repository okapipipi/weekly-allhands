<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="先週のふりかえり — Weekly All Hands / 2026.10.26" />
  <title>先週のふりかえり — Weekly All Hands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="deck" id="deck" aria-label="Weekly All Hands 2026.10.26">
    <div class="deck__track" id="track">

      <!-- 01 — 投稿なし -->
      <section class="slide section--grape" data-layout="section" aria-roledescription="slide" aria-labelledby="s1-title">
        <div class="section-deco" aria-hidden="true">
          <div class="blob blob--pink blob--big"></div>
        </div>
        <div class="slide__inner">
          <span class="kicker reveal" style="--i:0">WEEKLY WIKI ・ 2026.10.26 ・ 対象 10/16〜10/23</span>
          <div class="section__num reveal" style="--i:1">0</div>
          <h2 class="section__title reveal" style="--i:2" id="s1-title">先週は <em class="highlight">投稿がありませんでした</em></h2>
          <p class="section__sub reveal" style="--i:3">今週も、たくさんの知見を<br />共有し合っていきましょう！</p>
        </div>
      </section>

    </div>

    <!-- Chrome (bottom nav) -->
    <div class="chrome">
      <div class="chrome__brand">WEEKLY&nbsp;WIKI&nbsp;/&nbsp;10.26</div>
      <nav class="controls" aria-label="Slide navigation">
        <button class="control" data-action="prev" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <div class="counter" aria-live="polite">
          <span id="cur">01</span><span class="counter__sep">/</span><span id="tot">01</span>
        </div>
        <button class="control" data-action="next" aria-label="Next slide">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </nav>
    </div>

    <div class="progress" aria-hidden="true">
      <div class="progress__bar" id="bar"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
